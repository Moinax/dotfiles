# Herdr — custom keybindings only; everything else uses herdr's defaults
# (see `herdr --default-config`). The keybind legend is the built-in
# prefix+? help overlay, which lists these bindings with their descriptions.

[keys]
# prefix+o is repurposed for the project picker below; move the default
# open-notification-target jump to shift+o.
open_notification_target = "prefix+shift+o"

# Zellij-style direct pane navigation: alt+hjkl / alt+arrows, with the
# prefix+hjkl defaults kept alongside.
focus_pane_left = ["prefix+h", "alt+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+l", "alt+right"]

# Fullscreen (zoom) the focused pane. alt+f mirrors the zellij scratch
# toggle; the prefix+z default is kept.
zoom = ["prefix+z", "alt+f"]

# Cycle spaces (workspaces) directly with ctrl+alt+up/down, matching the
# sidebar's vertical order. Unset by default in herdr.
previous_workspace = "ctrl+alt+up"
next_workspace = "ctrl+alt+down"

# Direct tab jump like zellij's Alt+1..9 (prefix+1..9 still works).
# AZERTY: kitty translates alt+& é " ' ( into alt+1..5 at the terminal
# layer (see kitty.conf) — herdr 0.7.4 parses "alt+é" but silently drops
# it at runtime, misaligning every later [[keys.command]] binding.
switch_tab = ["prefix+1..9", "alt+1..9"]

# Fuzzy project picker (fd over ~/Projects → tv) that opens the picked
# project's dev environment via dev-mux — the in-herdr rofi-dev.
[[keys.command]]
key = "prefix+o"
type = "popup"
command = "dev-pick"
width = "70%"
height = "60%"
description = "Open project (dev picker)"

# Open an extra agent tab in the focused workspace, cloning the dev-herdr
# "agent" tab layout (agent + reviewr sidebar, dev/logs bottom row) with the
# same provider and project dir — several agents on one checkout, no
# worktree needed. ctrl+alt is free across the stack (Hyprland only uses
# SUPER+CTRL / ALT+CTRL+TAB, kitty only ctrl+alt+enter/r).
[[keys.command]]
key = "ctrl+alt+a"
type = "shell"
command = "herdr-nav agent-tab"
description = "New agent tab (same project)"

# Direct pane resize (alt+shift+hjkl), zellij-style; the native resize
# mode (prefix+r, then hjkl/arrows) also remains available.
[[keys.command]]
key = "alt+shift+h"
type = "shell"
command = "herdr-nav resize left"
description = "Resize pane left"

[[keys.command]]
key = "alt+shift+j"
type = "shell"
command = "herdr-nav resize down"
description = "Resize pane down"

[[keys.command]]
key = "alt+shift+k"
type = "shell"
command = "herdr-nav resize up"
description = "Resize pane up"

[[keys.command]]
key = "alt+shift+l"
type = "shell"
command = "herdr-nav resize right"
description = "Resize pane right"

# Agent sidebar ordering ("spaces" | "priority") — herdr's UI toggle
# persists this here, so keep it managed to avoid chezmoi drift.
[ui]
agent_panel_sort = "spaces"
