# Herdr — custom keybindings only; everything else uses herdr's defaults
# (see `herdr --default-config`). The keybind legend is the built-in
# prefix+? help overlay, which lists these bindings with their descriptions.

# Skip the first-run onboarding (herdr persists this here after the first
# launch; keep it managed to avoid chezmoi drift).
onboarding = false

[keys]
# prefix+o is repurposed for the project picker below; move the default
# open-notification-target jump to shift+o.
open_notification_target = "prefix+shift+o"

# Zellij-style direct pane navigation: alt+hjkl / alt+arrows, with the
# prefix+hjkl defaults kept alongside.
focus_pane_left = ["prefix+h", "alt+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+l", "alt+right"]

# Fullscreen (zoom) the focused pane. alt+f mirrors the zellij scratch
# toggle; the prefix+z default is kept.
zoom = ["prefix+z", "alt+f"]

# Cycle spaces (workspaces) directly with ctrl+alt+up/down, matching the
# sidebar's vertical order. Unset by default in herdr.
previous_workspace = "ctrl+alt+up"
next_workspace = "ctrl+alt+down"

# Direct tab jump like zellij's Alt+1..9 (prefix+1..9 still works).
# AZERTY: kitty translates alt+& é " ' ( into alt+1..5 at the terminal
# layer (see kitty.conf) — herdr 0.7.4 parses "alt+é" but silently drops
# it at runtime, misaligning every later [[keys.command]] binding.
switch_tab = ["prefix+1..9", "alt+1..9"]

# Browser-style tab management. ctrl+alt+t/w instead of plain ctrl+t/w:
# direct bindings swallow the key from every pane, and ctrl+t is the
# television file picker in the shells while ctrl+w is shell delete-word
# and nvim's window prefix. ctrl+alt matches the agent-tab cluster below.
# ctrl+tab/ctrl+shift+tab cycle tabs too, but they have no legacy terminal
# encoding and herdr 0.7.4 never receives them — kitty translates them to
# ctrl+alt+n/p (see kitty.conf), which is what's actually bound here.
new_tab = ["prefix+c", "ctrl+alt+t"]
close_tab = ["prefix+shift+x", "ctrl+alt+w"]
next_tab = ["prefix+n", "ctrl+alt+n"]
previous_tab = ["prefix+p", "ctrl+alt+p"]

# Close the active space. ctrl+alt+d joins the ctrl+alt cluster above and
# mirrors the "d" of the prefix+shift+d default (kept alongside); plain
# ctrl+w is off-limits for the same reason as close_tab above.
close_workspace = ["prefix+shift+d", "ctrl+alt+d"]

# Fuzzy project picker (fd over ~/Projects → tv) that opens the picked
# project's dev environment via dev-mux — the in-herdr rofi-dev.
[[keys.command]]
key = ["prefix+o", "ctrl+alt+o"]
type = "popup"
command = "dev-pick"
width = "70%"
height = "60%"
description = "Open project (dev picker)"

# Pick an agent provider (herdr-nav's shared list), then open it as an extra
# agent tab in the focused workspace. The tab clones the dev-herdr layout
# (agent + lazygit top row, dev/logs bottom row) in the same project directory
# — several agents on one checkout, no worktree needed. ctrl+alt is mostly
# free across the stack.
[[keys.command]]
key = "ctrl+alt+a"
type = "popup"
command = "herdr-nav agent-picker"
width = "40%"
height = "35%"
description = "New agent tab (pick provider)"

# Active code review: tuicr full-screen over the focused pane's working
# tree. The passive live diff stays in the hunk review pane; tuicr is the
# typed-comments tool (export with y/:clip, or read back via
# `tuicr review comments`). ctrl+alt+r matches lazygit's Alt+R review bind;
# kitty used to eat it for set_window_title — that custom map was dropped
# (rename stays on kitty's default ctrl+shift+alt+t). Quit tuicr (q) to
# close the popup.
[[keys.command]]
key = "ctrl+alt+r"
type = "popup"
command = "herdr-nav review"
width = "100%"
height = "100%"
description = "Review working tree (tuicr)"

# Direct pane resize (alt+shift+hjkl), zellij-style; the native resize
# mode (prefix+r, then hjkl/arrows) also remains available.
[[keys.command]]
key = "alt+shift+h"
type = "shell"
command = "herdr-nav resize left"
description = "Resize pane left"

[[keys.command]]
key = "alt+shift+j"
type = "shell"
command = "herdr-nav resize down"
description = "Resize pane down"

[[keys.command]]
key = "alt+shift+k"
type = "shell"
command = "herdr-nav resize up"
description = "Resize pane up"

[[keys.command]]
key = "alt+shift+l"
type = "shell"
command = "herdr-nav resize right"
description = "Resize pane right"

# Agent sidebar ordering ("spaces" | "priority") — herdr's UI toggle
# persists this here, so keep it managed to avoid chezmoi drift.
[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
[ui.toast]
delivery = "herdr"
