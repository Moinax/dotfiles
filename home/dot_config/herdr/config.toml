# Herdr — custom keybindings only; everything else uses herdr's defaults
# (see `herdr --default-config`). The keybind legend is the built-in
# prefix+? help overlay, which lists these bindings with their descriptions.

# Skip the first-run onboarding (herdr persists this here after the first
# launch; keep it managed to avoid chezmoi drift).
onboarding = false

[keys]
# prefix+o is repurposed for the project picker below; move the default
# open-notification-target jump to shift+o.
open_notification_target = "prefix+shift+o"

# Zellij-style direct pane navigation: alt+hjkl / alt+arrows, with the
# prefix+hjkl defaults kept alongside.
focus_pane_left = ["prefix+h", "alt+h", "alt+left"]
focus_pane_down = ["prefix+j", "alt+j", "alt+down"]
focus_pane_up = ["prefix+k", "alt+k", "alt+up"]
focus_pane_right = ["prefix+l", "alt+l", "alt+right"]

# Fullscreen (zoom) the focused pane. alt+f is the muscle-memory binding;
# the prefix+z default is kept.
zoom = ["prefix+z", "alt+f"]

# Cycle spaces (workspaces) directly with ctrl+alt+up/down, matching the
# sidebar's vertical order. Unset by default in herdr.
previous_workspace = "ctrl+alt+up"
next_workspace = "ctrl+alt+down"

# Direct tab jump on alt+1..9 (prefix+1..9 still works).
# AZERTY: kitty translates alt+& é " ' ( into alt+1..5 at the terminal
# layer (see kitty.conf) — herdr 0.7.4 parses "alt+é" but silently drops
# it at runtime, misaligning every later [[keys.command]] binding.
switch_tab = ["prefix+1..9", "alt+1..9"]

# Browser-style tab management. ctrl+alt+t/w instead of plain ctrl+t/w:
# direct bindings swallow the key from every pane, and ctrl+t is the
# television file picker in the shells while ctrl+w is shell delete-word
# and nvim's window prefix. ctrl+alt matches the agent-tab cluster below.
# ctrl+tab/ctrl+shift+tab cycle tabs too, but they have no legacy terminal
# encoding and herdr 0.7.4 never receives them — kitty translates them to
# ctrl+alt+n/p (see kitty.conf), which is what's actually bound here.
new_tab = ["prefix+c", "ctrl+alt+t"]
close_tab = ["prefix+shift+x", "ctrl+alt+w"]
next_tab = ["prefix+n", "ctrl+alt+n"]
previous_tab = ["prefix+p", "ctrl+alt+p"]

# X closes a Herdr context: without Shift it only closes the active space;
# Ctrl+Shift+X removes a linked worktree checkout too (with Herdr's native
# dirty-tree guard and confirmation). D is reserved for detaching the current
# session, matching Mod+Alt+D's detach-all at the compositor layer.
close_workspace = ["prefix+shift+d", "ctrl+alt+x"]
remove_worktree = "ctrl+shift+x"

# Pick an agent provider (herdr-nav's shared list), name it, and open it as an
# extra agent tab in the focused workspace. The tab clones the dev-herdr
# layout (agent + lazygit top row, dev/logs bottom row) in the same project
# directory — several agents on one checkout, no worktree needed. The name
# only labels the tab and the agent; it is never typed into the agent. Skip it
# (Enter) and herdr-agent-title names the tab after the first exchange.
# ctrl+alt is mostly free across the stack.
[[keys.command]]
key = "ctrl+alt+a"
type = "popup"
command = "herdr-nav agent-picker"
width = "60%"
height = "35%"
description = "New agent tab (provider + name)"

# Stop the current session and close its client window — the in-herdr
# equivalent of `hss <session>` (kills the agents; the saved layout
# persists, so reopening the session restores it fresh). Mirrors the
# desktop Mod+Alt+Q stop-all, scoped to this session.
[[keys.command]]
key = "ctrl+alt+q"
type = "shell"
command = "herdr-nav quit"
description = "Stop session & close window (kills agents)"

# Detach only this session's client; its server and agents keep running.
# This is the session-scoped counterpart of Hyprland's Mod+Alt+D detach-all.
[[keys.command]]
key = "ctrl+alt+d"
type = "shell"
command = "herdr-nav detach"
description = "Detach current session (keeps agents)"

# Active code review: a "review" tab running tuicr on the focused pane's
# working tree. The passive live diff stays in the agent tab's hunk pane;
# tuicr is the typed-comments tool (export with y/:clip, or read back via
# `tuicr review comments`). ctrl+alt+r matches lazygit's Alt+R review bind;
# kitty used to eat it for set_window_title — that custom map was dropped
# (rename stays on kitty's default ctrl+shift+alt+t).
[[keys.command]]
key = "ctrl+alt+r"
type = "shell"
command = "herdr-nav review"
description = "Review tab (tuicr)"

# Git ops: a "git" tab running lazygit on the focused pane's checkout.
[[keys.command]]
key = "ctrl+alt+g"
type = "shell"
command = "herdr-nav git"
description = "Git tab (lazygit)"

# The tool tabs: ctrl+alt+f/g/r each focus this workspace's yazi / lazygit /
# tuicr tab, creating it on the focused pane's cwd on first press. ctrl+alt+w
# (close_tab) disposes of one. All three were full-screen popups first and all
# three had the same two faults: a popup is session-modal, so the sidebar and
# tab bar keep rendering while swallowing clicks (it reads as a hung UI), and
# it forgets its cwd, filters and selection every time it closes. On demand
# rather than shipped in every workspace — rationale and measurements in
# herdr-nav's tool_tab.
# type = "shell" (not "pane"/"popup"): herdr-nav only talks to the socket API
# here; the tab it creates is what runs the tool.
# ctrl+alt+f is free across the stack; herdr's own alt+f (zoom pane) is a
# different chord.
[[keys.command]]
key = "ctrl+alt+f"
type = "shell"
command = "herdr-nav files"
description = "Files tab (yazi)"

# Direct pane resize (alt+shift+hjkl) without a mode; the native resize
# mode (prefix+r, then hjkl/arrows) also remains available.
[[keys.command]]
key = "alt+shift+h"
type = "shell"
command = "herdr-nav resize left"
description = "Resize pane left"

[[keys.command]]
key = "alt+shift+j"
type = "shell"
command = "herdr-nav resize down"
description = "Resize pane down"

[[keys.command]]
key = "alt+shift+k"
type = "shell"
command = "herdr-nav resize up"
description = "Resize pane up"

[[keys.command]]
key = "alt+shift+l"
type = "shell"
command = "herdr-nav resize right"
description = "Resize pane right"

# Agent sidebar ordering ("spaces" | "priority") — herdr's UI toggle
# persists this here, so keep it managed to avoid chezmoi drift.
[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

# What each agent row says. The sidebar is ~26 columns, so exactly one long
# thing fits and it must not appear twice:
#   row 1  the short coordinates — state, space, provider
#   row 2  the task, alone on its line: the tab label, which is named after
#          the work (herdr-agent-title keeps it in step with the agent's own
#          session title; herdr-nav seeds it from the task typed in the
#          ctrl+alt+a picker)
# The default layout put the tab on row 1 next to the space, which truncated
# both. Nothing here renames the agent itself — the `agent` token has to stay
# short ("claude", "codex") for row 1 to be worth reading.
[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", { token = "agent", dim = true }],
  ["tab"],
]
[ui.toast]
delivery = "off"

[ui.sound]
enabled = false

# Let programs inside a pane draw real images (yazi previews) instead of
# nothing at all. herdr swallows the Kitty graphics APC sequences unless this
# is on; yazi then falls through its adapter list to ueberzugpp/chafa, neither
# of which is installed, so the preview pane just stays blank. The outer
# terminal has to speak the protocol — kitty does. See herdrdev/herdr#1324.
# The attached client only picks this up on reattach: reload-config is not
# enough, detach (prefix+q) and run `herdr` again.
[experimental]
kitty_graphics = true
