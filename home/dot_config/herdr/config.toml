# Herdr — custom keybindings only; everything else uses herdr's defaults
# (see `herdr --default-config`). The keybind legend is the built-in
# prefix+? help overlay, which lists these bindings with their descriptions.

[keys]
# prefix+o is repurposed for the project picker below; move the default
# open-notification-target jump to shift+o.
open_notification_target = "prefix+shift+o"

# Fuzzy project picker (fd over ~/Projects → tv) that opens the picked
# project's dev environment via dev-mux — the in-herdr rofi-dev.
[[keys.command]]
key = "prefix+o"
type = "popup"
command = "dev-pick"
width = "70%"
height = "60%"
description = "Open project (dev picker)"

# Toggle the reviewr sidebar: diff review of agent changes with line
# comments delivered back to the agent. ("d" for diff — prefix+r is resize.)
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "Toggle reviewr (agent diff review)"

# Git-aware read-only file/diff viewer, split beside the current pane.
[[keys.command]]
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"
description = "File viewer (split)"

# Same viewer, full tab.
[[keys.command]]
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"
description = "File viewer (tab)"
