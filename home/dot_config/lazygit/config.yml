git:
  pagers:
    - colorArg: always
      # lazygit sets COLUMNS to the diff pane width and re-renders on resize:
      # side-by-side when wide, inline when narrow.
      pager: bash -c '[ "${COLUMNS:-80}" -ge 160 ] && exec delta --paging=never --side-by-side; exec delta --paging=never'
gui:
  nerdFontsVersion: "3"
os:
  editPreset: "nvim-remote"
  open: 'if [ -n "$NVIM" ]; then nvim --server "$NVIM" --remote {{filename}}; else xdg-open {{filename}}; fi'
customCommands:
  # tuicr code review on Ctrl+V, context-aware: working tree in the files
  # panel, branch..HEAD in the branches panel, selected commit(s) in the
  # commits panel (range selection reviews the whole range).
  - key: <c-v>
    context: files
    command: tuicr -w
    output: terminal
    description: Review working changes in tuicr
  - key: <c-v>
    context: localBranches
    command: tuicr -r {{.SelectedLocalBranch.Name}}..HEAD
    output: terminal
    description: Review selected branch..HEAD in tuicr
  - key: <c-v>
    context: commits
    command: tuicr -r {{.SelectedCommitRange.From}}^..{{.SelectedCommitRange.To}}
    output: terminal
    description: Review selected commit(s) in tuicr
