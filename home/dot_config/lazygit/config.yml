gui:
  nerdFontsVersion: "3"
os:
  editPreset: "nvim-remote"
  open: 'if [ -n "$NVIM" ]; then nvim --server "$NVIM" --remote {{filename}}; else xdg-open {{filename}}; fi'
customCommands:
  # tuicr code review on Alt+R, context-aware: working tree in the files
  # panel, branch..HEAD in the branches panel, selected commit(s) in the
  # commits panel (range selection reviews the whole range). Passive live
  # diff watching stays with hunk (core.pager); tuicr is the active review
  # tool — typed comments, batch export, review CLI.
  # Alt+R is free everywhere: lazygit (Ctrl+R = recent repos / reset
  # cherry-pick), Kitty, Hyprland.
  - key: <a-r>
    context: files
    command: tuicr -w
    output: terminal
    description: Review working changes in tuicr
  - key: <a-r>
    context: localBranches
    command: tuicr -r {{.SelectedLocalBranch.Name}}..HEAD
    output: terminal
    description: Review selected branch..HEAD in tuicr
  # subCommits is the list you get by pressing Enter on a branch — a distinct
  # context from the commits panel, so it needs naming here or Alt+R is
  # silently unbound there. SelectedCommitRange follows the focused context
  # (see lazygit's session_state_loader), so one command covers both.
  - key: <a-r>
    context: commits, subCommits
    command: tuicr -r {{.SelectedCommitRange.From}}^..{{.SelectedCommitRange.To}}
    output: terminal
    description: Review selected commit(s) in tuicr
