gui:
  nerdFontsVersion: "3"
os:
  editPreset: "nvim-remote"
  open: 'if [ -n "$NVIM" ]; then nvim --server "$NVIM" --remote {{filename}}; else xdg-open {{filename}}; fi'
customCommands:
  # tuicr code review on Alt+R, context-aware: working tree in the files
  # panel, branch..HEAD in the branches panel, selected commit(s) in the
  # commits panel (range selection reviews the whole range). Passive live
  # diff watching stays with hunk (herdr review pane + core.pager); tuicr
  # is the active review tool — typed comments, batch export, review CLI.
  # Alt+R is free everywhere: lazygit (Ctrl+R = recent repos / reset
  # cherry-pick), Kitty, Hyprland. Ctrl+Alt+R is herdr's review popup —
  # same tool, so the mnemonic lines up.
  - key: <a-r>
    context: files
    command: tuicr -w
    output: terminal
    description: Review working changes in tuicr
  - key: <a-r>
    context: localBranches
    command: tuicr -r {{.SelectedLocalBranch.Name}}..HEAD
    output: terminal
    description: Review selected branch..HEAD in tuicr
  - key: <a-r>
    context: commits
    command: tuicr -r {{.SelectedCommitRange.From}}^..{{.SelectedCommitRange.To}}
    output: terminal
    description: Review selected commit(s) in tuicr
