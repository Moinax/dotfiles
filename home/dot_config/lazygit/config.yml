gui:
  nerdFontsVersion: "3"
os:
  editPreset: "nvim-remote"
  open: 'if [ -n "$NVIM" ]; then nvim --server "$NVIM" --remote {{filename}}; else xdg-open {{filename}}; fi'
customCommands:
  # hunk code review on Alt+R, context-aware: working tree in the files
  # panel, branch..HEAD in the branches panel, selected commit(s) in the
  # commits panel (range selection reviews the whole range).
  # Alt+R is free everywhere: lazygit (Ctrl+R = recent repos / reset
  # cherry-pick), Kitty (Ctrl+Alt+R = set_window_title), Hyprland.
  - key: <a-r>
    context: files
    command: hunk diff
    output: terminal
    description: Review working changes in hunk
  - key: <a-r>
    context: localBranches
    command: hunk diff {{.SelectedLocalBranch.Name}}..HEAD
    output: terminal
    description: Review selected branch..HEAD in hunk
  - key: <a-r>
    context: commits
    command: hunk diff {{.SelectedCommitRange.From}}^..{{.SelectedCommitRange.To}}
    output: terminal
    description: Review selected commit(s) in hunk
