# RNNoise denoising for the dictation microphone.
#
# Exists for one reason: the Mod+D mic picker is often pointed at the Insta360
# webcam rather than the headset, on purpose, and a far-field mic hands Whisper
# room reverb and keyboard clatter along with the speech. Words that arrive
# under that noise come back truncated ("les P, etc.", "session order apr l
# quitt compl" in ~/.local/state/hyprvoice.log) and no amount of prompt or LLM
# post-processing recovers a word the mic never resolved. This cleans the audio
# before hyprvoice ever sees it.
#
# Publishes an extra Audio/Source node; hyprvoice-widget.py's picker lists every
# non-.monitor source, so it appears there next to the raw devices with no
# widget change. `[recording] device` stays empty — the picker still drives
# everything through `pactl set-default-source`.
#
# Needs the `noise-suppression-for-voice` package for librnnoise_ladspa.
# `systemctl --user restart pipewire.service` after editing.
context.modules = [
    { name = libpipewire-module-filter-chain
        # nofail: the webcam is USB and may simply be absent at login. Without
        # this a missing target takes the module down at daemon start.
        flags = [ nofail ]
        args = {
            node.description = "Insta360 Link 2C (RNNoise)"
            media.name       = "Insta360 Link 2C (RNNoise)"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        # Resolved via LADSPA_PATH / /usr/lib/ladspa rather than
                        # hardcoded, so a package rebuild moving the .so does not
                        # silently drop the filter.
                        plugin = "librnnoise_ladspa"
                        # mono, not stereo: the capture side is a mono source and
                        # hyprvoice records 1ch. Stereo would cost 2x CPU for a
                        # duplicated channel.
                        label  = noise_suppressor_mono
                        control = {
                            # 0 = denoise only, voice gate off. Upstream suggests
                            # 85-95 for calls, and that is the wrong end of the
                            # dial for speech recognition: the gate SILENCES
                            # anything it scores below the threshold, and on a
                            # far-field mic the quiet trailing syllables are
                            # exactly what scores low — so a "good" call setting
                            # deletes the very words that are already at risk.
                            #
                            # Digital silence is also actively harmful here:
                            # Whisper is known to hallucinate text over fully
                            # silent stretches. A gated source can additionally
                            # trip the overlay's SILENT_AFTER_S "micro muet"
                            # flag — though only in the first 2s after picking
                            # the device, since meter.heard_signal latches on
                            # the first non-zero sample and resets only on a
                            # device change. Not a mid-sentence risk.
                            #
                            # Denoising itself runs regardless of this value; the
                            # threshold only governs the extra gate. Raise it if
                            # steady background noise ever survives into the
                            # transcript, and re-check the trailing words when you do.
                            "VAD Threshold (%)" = 0.0
                            "VAD Grace Period (ms)" = 200
                            # Retroactive grace buys back word ONSETS, but the
                            # upstream docs are explicit that it does so by adding
                            # latency to a path that is already toggle-to-text.
                            # Left at 0; with the gate off it has nothing to undo.
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                ]
            }
            capture.props = {
                node.name    = "capture.rnnoise_source"
                # Pinned rather than following the default source: unpinned, this
                # filter would capture whatever is default — including itself, the
                # moment the picker selects it.
                #
                # Machine-specific by nature. `pactl list sources short` gives the
                # name if the webcam is ever replaced; a stale name here costs
                # nothing but the node failing to link (see nofail above).
                target.object = "alsa_input.usb-Insta360_Insta360_Link_2C-02.mono-fallback"
                node.passive  = true
                # RNNoise is trained at 48 kHz and only runs there. Both sides are
                # pinned so PipeWire cannot negotiate the graph to another rate;
                # hyprvoice asks for 16 kHz and gets it by resampling downstream.
                audio.rate    = 48000
            }
            playback.props = {
                node.name   = "rnnoise_source"
                media.class = Audio/Source
                audio.rate  = 48000
            }
        }
    }
]
