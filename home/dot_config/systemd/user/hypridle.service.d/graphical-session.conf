[Unit]
# Stock unit gates on ConditionEnvironment=WAYLAND_DISPLAY, which races with
# uwsm's env import at session start: graphical-session.target can activate
# before WAYLAND_DISPLAY lands in the user-manager env, so hypridle's job is
# silently condition-skipped — and skipped units are never retried, leaving the
# session with no logind Lock handler (loginctl lock-session becomes a no-op).
# Clear the condition so the unit is always queued, and let Restart bring it up
# once the wayland socket is reachable.
ConditionEnvironment=
StartLimitIntervalSec=0

[Service]
Slice=background-graphical.slice
Restart=on-failure
RestartSec=1
