# Theme for hyprtoolkit apps: hyprland-share-picker (the xdph screen-share
# dialog), hyprland-guiutils dialogs. Read once at app start, so a change shows
# on the next dialog, no restart needed.
#
# Same palette as the rest of the desktop: the Catppuccin base waybar and the
# group tabs sit on, and the pink/blue of the window borders. Dark in both
# modes, like the borders (see conf/general.lua).

background       = rgba(1e1e2ed9)
base             = rgba(313244ff)
alternate_base   = rgba(45475aff)
text             = rgba(cdd6f4ff)
bright_text      = rgba(ffffffff)
accent           = rgba(9696ffff)
accent_secondary = rgba(ff64ffff)

font_family = Noto Sans

rounding_large = 10
rounding_small = 6
