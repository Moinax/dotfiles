# See https://wiki.hyprland.org/Configuring/Variables/ for more
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # Let a fresh hyprlock take over an orphaned session lock after the locker
    # crashes (default off rejects it with "got yeeten"), so a hyprlock crash
    # no longer wedges the session into a locked-but-no-locker state that only a
    # Hyprland restart can clear. See hypridle-dpms-guard.sh / project memory.
    allow_session_lock_restore = true
}
