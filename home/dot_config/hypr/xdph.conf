# Screen sharing. The portal's own config, read by xdg-desktop-portal-hyprland;
# nothing in here reaches Hyprland itself.
#
# Browsers ask for cursor_mode METADATA -- send me the pointer coordinates, I
# will draw it myself. xdph implements only hidden and embedded, and its
# fallback for an unsupported mode is the session default, which is the
# protocol's: hidden. So a Meet share ends up with no pointer at all, and
# nothing in the browser says why.
#
# 2 is embedded: the pointer is composited into the stream by the compositor.
screencopy {
    cursor_mode = 2
}
