general {
    lock_cmd = pidof swaylock || swaylock       # avoid starting multiple swaylock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms("on")'
}


listener {
    timeout = 250
    on-timeout = notify-send "Your screen will turn off due to inactivity"
}

# Idle DPMS-off WITHOUT an auto-lock. The screen powers off and wakes on input,
# unlocked. Locking still happens before suspend (before_sleep_cmd) and on
# demand via Mod+Alt+L.
listener {
    timeout = 300                                                    # 5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms("off")'               # screen off
    on-resume = hyprctl dispatch 'hl.dsp.dpms("on")'                 # screen back on
}

# Auto-suspend uses s2idle for now. S3/deep currently hangs this desktop at
# "PM: suspend entry (deep)", so GRUB is configured with mem_sleep_default=s2idle
# until we come back to the kernel/firmware/NVIDIA deep-suspend regression.
listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
