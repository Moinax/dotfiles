general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = ~/.local/bin/hypridle-dpms-resume-guard.sh  # screen on after sleep unless hyprlock is still running.
}


listener {
    timeout = 250
    on-timeout = notify-send "Your screen will turn off due to inactivity"
}

# Idle DPMS-off WITHOUT an auto-lock (chosen 2026-06-14). On this NVIDIA box the
# pinned hyprlock 0.9.5 crashes when monitors are DPMS-off for minutes while it
# runs (see project_hyprlock_dpms_crash) — so we deliberately do NOT auto-lock
# on idle. The screen powers off and wakes on input, unlocked. Locking still
# happens before suspend (before_sleep_cmd) and on demand via Mod+Alt+L.
#
# The guard scripts are kept: if you DO manually lock and then go idle, hyprlock
# is running, so hypridle-dpms-guard.sh skips the DPMS-off and the screen stays
# lit on the lock screen — avoiding the crash in that case too.
listener {
    timeout = 300                                                    # 5min
    on-timeout = ~/.local/bin/hypridle-dpms-guard.sh                 # screen off (skipped while hyprlock runs — see hypridle-dpms-guard.sh)
    on-resume = ~/.local/bin/hypridle-dpms-resume-guard.sh           # screen back on (skipped while hyprlock runs — a redundant dpms("on") modesets and breaks hyprlock on NVIDIA)
}

# Auto-suspend uses s2idle for now. S3/deep currently hangs this desktop at
# "PM: suspend entry (deep)", so GRUB is configured with mem_sleep_default=s2idle
# until we come back to the kernel/firmware/NVIDIA deep-suspend regression.
listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
