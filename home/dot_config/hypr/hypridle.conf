general {
    # --no-fade-in is not cosmetic here, it is what lets the settle in
    # lock-before-sleep.sh be short: hyprlock's fade blends *from a screencopy of
    # the desktop*, so its first commits still show what the lock is hiding, and
    # anything waiting for "the frame landed" would have to outlast the whole
    # animation rather than the lock.
    #
    # --immediate-render was tried alongside it and removed. It does what it says —
    # "don't wait for resources" — so `onLockLocked` fires *before* "Gathered all
    # screencopy frames" and the lock paints with no background: black, with the
    # input field floating on it, until the resources land. Harmless for the leak
    # (black hides the desktop just as well) but ugly, and it bought nothing the
    # settle needed: onLockLocked already followed the screencopy by 7-14ms.
    lock_cmd = pidof hyprlock || hyprlock --no-fade-in
    before_sleep_cmd = loginctl lock-session
    # A wake event can be consumed before Wayland resumes dispatching input. In
    # that case the listeners which fired before suspend stay fired forever:
    # DPMS is enabled here, but neither DPMS-off nor suspend gets a fresh timer.
    # Reset the compositor's idle clock so every listener is rearmed without
    # restarting hypridle or losing its D-Bus inhibitor cookies.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; hyprctl dispatch 'hl.dsp.force_idle(0)'
    inhibit_sleep = 3
}


listener {
    timeout = 250
    on-timeout = notify-send "Your computer will be locked due to inactivity"
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1800
    # Caffeine mode has to outlive the lock screen, and on its own it does not:
    # Hyprland stops honouring the idle inhibitor once hyprlock holds the session,
    # so the compositor starts reporting idle again and every listener above
    # rearms with the inhibitor still up. Measured on 2026-10-13: nine and a half
    # hours without a single idle event, then a manual lock at 03:33:29 and the
    # four rules firing from 03:34:40 — ending in a suspend nobody asked for.
    #
    # Only this listener is gated. Locking and blanking a machine left alone are
    # what caffeine mode is least in the way of; suspending it mid-run is the one
    # that loses work.
    #
    # Keyed on the inhibitor process rather than the state file waybar reads: the
    # process *is* the inhibition, so a dead inhibitor with a stale "on" in the
    # state file suspends, which is the honest outcome. `-x` is what keeps the
    # `sh -c` wrapper hypridle spawns from matching its own pattern.
    on-timeout = pgrep -fx "python3 .*/wayland-idle-inhibitor\.py" || systemctl suspend
}
