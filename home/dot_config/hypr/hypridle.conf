general {
    lock_cmd = pidof swaylock || swaylock       # avoid starting multiple swaylock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = ~/.local/bin/toggle-dpms.sh on
}


listener {
    timeout = 250
    on-timeout = notify-send "Your computer will be locked due to inactivity"
}

# Idle auto-lock, restored 2026-06-19. It was dropped 2026-06-14 only because the
# pinned hyprlock crashed when DPMS-off for minutes (project_hyprlock_dpms_crash);
# we now lock with swaylock, which survives the NVIDIA DPMS/output cycle, so the
# hyprlock-specific reason no longer applies. Mirrors the niri/swayidle flow:
# lock at 5min, power the screen off 30s later, suspend at 30min.
listener {
    timeout = 300                                                    # 5min — lock first
    on-timeout = loginctl lock-session                              # -> hypridle lock_cmd (swaylock)
}

listener {
    timeout = 330                                                    # 5.5min — then screen off
    on-timeout = ~/.local/bin/toggle-dpms.sh off                     # screen off with input wake listener
    on-resume = ~/.local/bin/toggle-dpms.sh on                       # screen back on
}

# Auto-suspend uses s2idle for now. S3/deep currently hangs this desktop at
# "PM: suspend entry (deep)", so GRUB is configured with mem_sleep_default=s2idle
# until we come back to the kernel/firmware/NVIDIA deep-suspend regression.
listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
