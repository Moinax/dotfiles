# Arch Linux base packages
# These are installed via pacman/paru

packages:
  core:
    # Shell and terminal
    - zsh
    - zsh-autosuggestions
    - zsh-syntax-highlighting
    - fish
    - starship
    - zellij

    # Core utilities
    - git
    - bat
    - eza
    - fd
    - fzf
    - ripgrep
    - television
    - fastfetch
    - tealdeer  # tldr client; CachyOS ships this instead of `tldr` (they conflict)
    - btop
    - jq
    - yq
    - expac  # list_installed_packages reads names+provides+replaces from it in one
             # 48ms call; the pacman -Qi fallback costs 830ms, and every `dots
             # packages`/`dots update` scan pays it. Was present only as a
             # cachyos-fish-config dependency, so a package change could have
             # dropped it and silently un-done that.
    - socat  # talk to herdr's unix-socket API (tab.move, etc.) from dev scripts
    - rsync
    - unzip
    - age  # encrypt project backups (dots backup)
    - fontconfig
    - downgrade  # AUR — roll a package back to a cached/ALA version + offer to pin it via IgnorePkg

    # File management
    - yazi
    - resvg  # yazi rasterizes SVG previews through it; missing = "Failed to start `resvg`"

  desktop:
    # Terminal emulator
    - kitty

    # GTK theme integration for KDE
    - breeze-gtk

    # SSH askpass — GUI passphrase prompt for ssh/git run without a terminal
    - ksshaskpass

    # Desktop app containers
    - distrobox
    - podman

    # Peripherals
    - headsetcontrol

    # GPU monitor
    - nvtop

    # Fonts
    - ttf-firacode-nerd
    - ttf-jetbrains-mono-nerd
    - ttf-fira-sans
    - ttf-font-awesome

    # Theming
    - catppuccin-cursors-mocha  # AUR — Catppuccin Mocha cursor pack (dark mode)
    - catppuccin-cursors-latte  # AUR — Catppuccin Latte cursor pack (light mode)
    - matugen                   # Material You palette generator from wallpaper

    # AppImage runtime support
    - fuse2

  aur:
    # AUR-only packages (installed via paru)
    - paru  # Will be installed first if not present
