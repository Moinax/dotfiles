# Arch Linux base packages
# These are installed via pacman/paru

packages:
  core:
    # Shell and terminal
    - zsh
    - zsh-autosuggestions
    - zsh-syntax-highlighting
    - fish
    - starship
    - zellij

    # Core utilities
    - git
    - bat
    - eza
    - fd
    - fzf
    - ripgrep
    - television
    - fastfetch
    - tealdeer  # tldr client; CachyOS ships this instead of `tldr` (they conflict)
    - btop
    - jq
    - yq
    - expac  # list_installed_packages reads names+provides+replaces from it in one
             # 48ms call; the pacman -Qi fallback costs 830ms, and every `dots
             # packages`/`dots update` scan pays it. Was present only as a
             # cachyos-fish-config dependency, so a package change could have
             # dropped it and silently un-done that.
    - socat  # talk to herdr's unix-socket API (tab.move, etc.) from dev scripts
    - rsync
    - unzip
    - age  # encrypt project backups (dots backup)
    - fontconfig
    - downgrade  # AUR — roll a package back to a cached/ALA version + offer to pin it via IgnorePkg

    # File management
    - yazi
    - resvg  # yazi rasterizes SVG previews through it; missing = "Failed to start `resvg`"

  desktop:
    # Terminal emulator
    - kitty

    # GTK theme integration for KDE
    - breeze-gtk

    # SSH askpass — GUI passphrase prompt for ssh/git run without a terminal
    - ksshaskpass

    # Desktop app containers
    - distrobox
    - podman

    # Peripherals
    - headsetcontrol
    # Bluetooth stack. Baseline rather than a group's business: it was declared
    # by both hyprland (a desktop wants it) and gaming (xpadneo pairs an Xbox
    # controller over it), which is two groups asserting the same baseline and
    # left a machine's bluetooth depending on which boxes happened to be ticked.
    # The `blueman` tray applet stays in hyprland — that belongs to the shell
    # that has a tray, unlike the stack under it.
    #
    # `bluez` as well as `bluez-utils`, and that pairing is load-bearing:
    # bluetooth.service is shipped by `bluez`, while `bluez-utils` (bluetoothctl
    # and friends) does not depend on it. Declaring only the utils left the
    # service below with nothing to enable on any desktop that skipped hyprland —
    # `blueman` was the sole thing pulling `bluez` in, which is exactly the
    # which-boxes-were-ticked coupling this move exists to remove.
    - bluez
    - bluez-utils

    # GPU monitor
    - nvtop

    # Fonts
    - ttf-firacode-nerd
    - ttf-jetbrains-mono-nerd
    - ttf-fira-sans
    - ttf-font-awesome

    # Theming
    - catppuccin-cursors-mocha  # AUR — Catppuccin Mocha cursor pack (dark mode)
    - catppuccin-cursors-latte  # AUR — Catppuccin Latte cursor pack (light mode)
    - matugen                   # Material You palette generator from wallpaper

    # AppImage runtime support
    - fuse2

  aur:
    # AUR-only packages (installed via paru)
    - paru  # Will be installed first if not present

# System services enabled on every install, gated by purpose exactly as the
# package sections above are: `core` always, `desktop` unless this is a
# terminal-only install. Read by base_desired_services.
services:
  desktop:
    - bluetooth
