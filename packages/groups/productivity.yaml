# Productivity - File managers, backup, and productivity tools
name: Productivity
description: File management, KDE apps, archives and cloud sync
icon: 📁
environment: desktop

# Dotfiles to install when this group is selected
dotfiles:
  - dot_config/yazi
  - dot_icons
  - dot_themes

# No services
services: []

descriptions:
  dolphin: KDE file manager
  ghostwriter: Distraction-free Markdown editor (KDE) — long-form writing, next to Kate's editing
  gwenview: KDE image viewer
  kate: KDE text editor — the desktop $VISUAL
  markdownpart: KPart rendering Markdown — without it Kate's Preview pane is blank on .md
  marksman: Markdown language server — the one Kate's stock LSP config asks for on .md
  okular: KDE document viewer (PDF, EPUB, DjVu)
  ark: KDE archive manager (Dolphin right-click "Extract here")
  ffmpegthumbnailer: Video thumbnail generator
  kdegraphics-thumbnailers: Image/PDF thumbnail plugins
  dropbox: Dropbox cloud file sync (official dist binary, bypasses distro package)
  localsend-bin: LocalSend — AirDrop-style LAN file sharing (AUR)
  p7zip: 7-Zip archive tool
  unrar: RAR archive extractor
  unzip: ZIP archive extractor

packages:
  arch:
    # File managers
    - dolphin
    - ffmpegthumbnailer
    - kdegraphics-thumbnailers

    # KDE apps
    - ghostwriter
    - gwenview
    - kate
    # Kate's markdown story needs both: markdownpart renders the Preview pane,
    # marksman answers its LSP client. Kate's stock LSP config names a server per
    # language without depending on it, so a missing one is a console warning on
    # every open — nvim's servers live in Mason's own dir and are invisible here.
    - markdownpart
    - marksman
    - okular
    - ark

    # BTRFS snapshots are handled entirely by CachyOS's stock stack
    # (snapper + snap-pac + limine-snapper-sync + btrfs-assistant, pulled in by
    # the cachyos-snapper-support meta-package at install time), so we install
    # nothing here. On non-CachyOS Arch derivatives, set up snapshots manually.

    # Cloud sync — dropbox installed via custom_install (Dropbox's own
    # auto-updater fights any distro package)

    # LAN file sharing
    - localsend-bin  # AUR

    # Archive tools
    - p7zip
    - unrar
    - unzip

custom_install:
  # Dropbox's in-app auto-updater downloads dist binaries to ~/.dropbox-dist/
  # and SIGKILLs the running daemon to swap them in. Any distro-packaged
  # /opt/dropbox/ install loses that fight (restart-loop). We install the
  # official dist tarball directly; the systemd user unit at
  # ~/.config/systemd/user/dropbox.service runs ~/.dropbox-dist/dropboxd.
  - name: dropbox
    check: '[ -x "$HOME/.dropbox-dist/dropboxd" ]'
    # Download to a temp file before extracting so a truncated curl can't
    # leave a partial ~/.dropbox-dist/ that passes the check on the next run.
    install: |
      tmp=$(mktemp -t dropbox-dist.XXXXXX.tar.gz) \
        && curl -fsSL "https://www.dropbox.com/download?plat=lnx.x86_64" -o "$tmp" \
        && tar -C "$HOME" -xzf "$tmp" \
        && rm -f "$tmp"
    # The in-app auto-updater owns ~/.dropbox-dist/ — re-extracting the tarball
    # underneath a running daemon is exactly the fight we avoid elsewhere.
    updated_by: self
    # No CLI to ask; the dist directory records what the auto-updater installed.
    version: cat "$HOME/.dropbox-dist/VERSION"
