# Productivity - File managers, backup, and productivity tools
name: Productivity
description: File managers, backup tools, and productivity apps
icon: 📁
environment: desktop

# Dotfiles to install when this group is selected
dotfiles:
  - dot_config/yazi
  - dot_icons
  - dot_themes

# No services
services: []

descriptions:
  dolphin: KDE file manager
  gwenview: KDE image viewer
  kate: KDE text editor
  okular: KDE document viewer (PDF, EPUB, DjVu)
  ark: KDE archive manager (Dolphin right-click "Extract here")
  ffmpegthumbnailer: Video thumbnail generator
  kdegraphics-thumbnailers: Image/PDF thumbnail plugins
  slack-desktop: Team communication app (AUR)
  telegram-desktop: Telegram messaging app
  bitwarden: Bitwarden password manager desktop app
  helium: Helium web browser (AppImage, set as default)
  zen-browser-bin: Zen Browser (AUR)
  google-chrome: Google Chrome web browser (AUR)
  dropbox: Dropbox cloud file sync (official dist binary, bypasses distro package)
  localsend-bin: LocalSend — AirDrop-style LAN file sharing (AUR)
  p7zip: 7-Zip archive tool
  unrar: RAR archive extractor
  unzip: ZIP archive extractor

packages:
  arch:
    # File managers
    - dolphin
    - ffmpegthumbnailer
    - kdegraphics-thumbnailers

    # KDE apps
    - gwenview
    - kate
    - okular
    - ark

    # BTRFS snapshots are handled entirely by CachyOS's stock stack
    # (snapper + snap-pac + limine-snapper-sync + btrfs-assistant, pulled in by
    # the cachyos-snapper-support meta-package at install time), so we install
    # nothing here. On non-CachyOS Arch derivatives, set up snapshots manually.

    # Communication
    - slack-desktop  # AUR
    - telegram-desktop

    # Password manager
    - bitwarden

    # Web browsers
    - zen-browser-bin  # AUR
    - google-chrome  # AUR
    - speech-dispatcher  # web speech synthesis (SpeechSynthesis API)

    # Cloud sync — dropbox installed via custom_install (Dropbox's own
    # auto-updater fights any distro package)

    # LAN file sharing
    - localsend-bin  # AUR

    # Archive tools
    - p7zip
    - unrar
    - unzip

custom_install:
  # Helium ships only as an AppImage. install-github resolves the latest release,
  # picks the asset for the current arch, imports it via the AppImage mechanism
  # (~/.local/share/AppImages/helium.AppImage + helium.desktop launcher that
  # mimeapps.list points at as the default browser), and records the release
  # source so './manage.sh apps check-updates / update' keep it current.
  # --name helium is load-bearing: slugify lowercases it to "helium", so the
  # resulting helium.AppImage / helium.desktop match the binds + mimeapps refs.
  - name: helium
    check: '[ -x "$HOME/.local/share/AppImages/helium.AppImage" ]'
    requires: curl
    # FUSE is needed to *run* the AppImage (extraction during import does not).
    # Desktop installs already pull this in via install_appimage_support; declared
    # here too so selecting Helium alone still works.
    requires_packages:
      arch: [fuse2]
    install: |
      "$DOTFILES_DIR/tools/manage-external-apps.py" install-github imputnet/helium-linux \
        --name helium --type appimage --non-interactive
    # Tracked as an external app (recorded release source), so './manage.sh
    # update' reports it from the apps updater instead of re-running install.
    updated_by: app

  # Dropbox's in-app auto-updater downloads dist binaries to ~/.dropbox-dist/
  # and SIGKILLs the running daemon to swap them in. Any distro-packaged
  # /opt/dropbox/ install loses that fight (restart-loop). We install the
  # official dist tarball directly; the systemd user unit at
  # ~/.config/systemd/user/dropbox.service runs ~/.dropbox-dist/dropboxd.
  - name: dropbox
    check: '[ -x "$HOME/.dropbox-dist/dropboxd" ]'
    # Download to a temp file before extracting so a truncated curl can't
    # leave a partial ~/.dropbox-dist/ that passes the check on the next run.
    install: |
      tmp=$(mktemp -t dropbox-dist.XXXXXX.tar.gz) \
        && curl -fsSL "https://www.dropbox.com/download?plat=lnx.x86_64" -o "$tmp" \
        && tar -C "$HOME" -xzf "$tmp" \
        && rm -f "$tmp"
    # The in-app auto-updater owns ~/.dropbox-dist/ — re-extracting the tarball
    # underneath a running daemon is exactly the fight we avoid elsewhere.
    updated_by: self
    # No CLI to ask; the dist directory records what the auto-updater installed.
    version: cat "$HOME/.dropbox-dist/VERSION"
