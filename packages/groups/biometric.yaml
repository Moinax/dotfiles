# Biometric - Fingerprint authentication (fprintd + PAM)
name: Biometric
description: Fingerprint reader (fprintd) for login, sudo, and polkit (Bitwarden biometric unlock)
icon: 🫆
environment: desktop

# Hardware-gated: auto-skipped on machines without a fingerprint reader. The
# requires_hardware field below is honoured by both the installer and the
# package manager via group_hardware_available() (install/lib/common.sh), which
# maps "fingerprint" to has_fingerprint_reader() (install/lib/detect.sh).
requires_hardware: fingerprint

# No dotfiles to manage
dotfiles: []

# fprintd.service is socket-activated by D-Bus, no need to enable.
services: []

descriptions:
  fprintd: Fingerprint reader daemon (libfprint)
  fprintd-pam: PAM module for fprintd (Fedora / Debian / Ubuntu)

packages:
  arch:
    - fprintd

  fedora:
    - fprintd
    - fprintd-pam

  debian:
    - fprintd
    - libpam-fprintd
