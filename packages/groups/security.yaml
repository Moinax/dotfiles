# Security - Antivirus scanning, password management and encrypted directories
name: Security
description: Password manager, ClamAV antivirus and encrypted directories
icon: 🛡️
environment: both

# No dotfiles to manage
dotfiles: []

# Services are enabled by setup_clamav() in installer.sh
# (clamav-freshclam + clamav-daemon).
services: []

# The GUI half. This group is `environment: both`, so a terminal install still
# offers it — and would otherwise have pulled a Qt password manager and a GTK
# antivirus front-end onto a headless box. rbw is deliberately *not* here: a CLI
# vault client is exactly what a terminal machine wants.
desktop_only:
  - clamtk
  - bitwarden

descriptions:
  clamav: ClamAV antivirus engine (clamscan / clamdscan)
  clamtk: Graphical front-end for ClamAV (AUR)
  bitwarden: Bitwarden password manager desktop app
  rbw: Unofficial Bitwarden CLI — required by the vicinae Bitwarden extension
  gocryptfs: Per-directory encryption behind the `vault` command

packages:
  arch:
    # clamav bundles freshclam + clamav-daemon service units
    - clamav
    - clamtk  # AUR

    # Password manager. Here rather than in productivity: a vault is a security
    # tool, and productivity is file management.
    - bitwarden
    # CLI vault client, and what the vicinae Bitwarden extension shells out to.
    # Its own agent holds the master key, independently of the desktop app.
    - rbw

    # What `vault` drives. LUKS already covers the stolen machine; this covers
    # the unlocked session and the directories that get synced off it.
    - gocryptfs
