# Hyprland - Wayland compositor and related tools
name: Hyprland
description: Hyprland compositor with Wayland tools (waybar, vicinae, swaync)
icon: 🪟
environment: desktop

# Dotfiles to install when this group is selected
dotfiles:
  - dot_config/hypr
  - dot_config/waybar
  - dot_config/vicinae
  - dot_config/swaync
  - dot_config/swayosd
  - dot_config/wlogout
  - dot_local/share/vicinae

# No system services of its own — the bluetooth stack and its unit are baseline
# now, in packages/arch/base.yaml. `blueman` below stays here: the tray applet
# belongs to the shell that has a tray.
services: []

# Per-user units, enabled in the caller's own systemd instance — never with sudo.
# vicinae is declared here rather than left to the package's systemd preset so
# the repo, not the AUR build, decides the launcher runs: a preset only enables,
# and enabling under an already-active graphical-session.target starts nothing.
user_services:
  - vicinae.service

descriptions:
  hyprland: Dynamic tiling Wayland compositor
  hypridle: Idle daemon for Hyprland
  hyprlock: Screen locker for Hyprland
  awww: Animated wallpaper daemon (renamed swww) with IPC and transitions
  hyprpicker: Color picker for Hyprland
  polkit-kde-agent: Polkit authentication agent (KDE)
  hyprshot: Screenshot tool for Hyprland
  wf-recorder: Wayland screen recorder
  swayosd: On-screen display for volume, brightness and caps-lock
  python-pywayland: Python Wayland bindings (idle inhibitor for caffeine mode)
  waybar: Highly customizable status bar
  kcalc: KDE calculator application
  vicinae-bin: Raycast-style launcher (native Qt, React/TS extensions)
  swaync: Notification center with drawer and DND
  wlogout: Logout menu for Wayland
  cliphist: Clipboard history manager
  wl-clipboard: Wayland clipboard utilities
  wtype: Wayland keyboard input simulator
  pavucontrol-qt: PulseAudio volume control GUI (Qt)
  blueman: Bluetooth device manager (tray applet)
  network-manager-applet: NetworkManager tray applet (nm-applet)
  kde-gtk-config: KDE service that synchronizes Plasma appearance into GTK
  xorg-xhost: X server access control
  inotify-tools: File system event monitor
  cmatrix: Terminal matrix rain animation
  xdg-desktop-portal-kde: KDE portal backend (color-scheme, file chooser, etc.)
  xdg-desktop-portal-hyprland: Hyprland portal backend (screenshot, screencast)
  uwsm: Universal Wayland Session Manager (wraps Hyprland in a systemd unit)

packages:
  arch:
    # Hyprland core
    - hyprland
    - hypridle
    - hyprlock
    - awww  # provides swww/swww-daemon — animated wallpaper daemon
    - hyprpicker
    - polkit-kde-agent
    - hyprshot
    - wf-recorder
    - uwsm

    # Status bar and menus
    - waybar
    # vicinae is the launcher every keybind points at. rofi and its plugins are
    # deliberately absent from this branch: main still carries them, and that is
    # the copy the two are compared by switching between.
    - vicinae-bin  # AUR — prebuilt; building vicinae from source is a long Qt/C++ compile
    - kcalc
    # Notifications
    - swaync
    # Logout screen
    - wlogout

    # Clipboard
    - extra/cliphist
    - extra/wl-clipboard
    - wtype

    # Audio control
    - pavucontrol-qt
    - blueman  # bluez-utils itself is baseline — packages/arch/base.yaml

    # Network tray applet (SNI icon in Waybar tray)
    - network-manager-applet

    # Keep GTK settings/colors synchronized with the KDE appearance source
    - kde-gtk-config

    # On-screen display (volume, brightness, caps-lock)
    - swayosd

    # X compatibility
    - xorg-xhost
    
    # Idle inhibitor (caffeine mode)
    - python-pywayland

    # XDG Desktop Portal
    - xdg-desktop-portal-kde
    - xdg-desktop-portal-hyprland

    # Other Wayland tools
    - inotify-tools
    - cmatrix
