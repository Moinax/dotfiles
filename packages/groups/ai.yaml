# AI - AI-powered tools (dictation, assistants, etc.)
name: AI
description: AI-powered desktop tools (voice dictation, assistants)
icon: 🤖
environment: desktop

# Dotfiles to install when this group is selected
dotfiles:
  - dot_config/hyprvoice

descriptions:
  hyprvoice-bin: Speech-to-text dictation tool (AUR)
  whisper.cpp: Local speech recognition engine
  vibewatch: AI agent status bar & overlay for Hyprland (built from source via cargo)

# Tools installed via custom commands (not available in package managers).
# These appear in the package selector alongside distro packages.
# Fields: name (display + selection key), check (command to test if installed),
#         install (shell command to run), requires (dependency command to check),
#         requires_packages (map of distro family -> system packages to
#         install before running `install`)
custom_install:
  - name: vibewatch
    check: command -v vibewatch
    install: curl -fsSL https://raw.githubusercontent.com/Moinax/vibewatch/main/install.sh | sh
    requires: cargo
    # System prerequisites for `cargo install --git`: Rust toolchain +
    # native libs for vibewatch's default features (panel=gtk4/libadwaita/
    # gtk4-layer-shell, sound=alsa via rodio).
    requires_packages:
      arch: [rust, pkgconf, gtk4, libadwaita, gtk4-layer-shell, alsa-lib]

packages:
  arch:
    # Dictation (speech-to-text)
    - hyprvoice-bin
    - whisper.cpp
