# Development - Development tools and environments
name: Development
description: Development tools (docker, neovim, git tools, editors)
icon: 💻
environment: both

# Dotfiles to install when this group is selected
dotfiles:
  - dot_config/nvim
  - dot_config/Cursor
  - dot_config/hunk
  - dot_config/tuicr
  - dot_config/gh-dash
  - dot_config/worktrunk
  - dot_config/ccstatusline
  - dot_config/herdr
  - dot_gitconfig

# Services to enable
services:
  - docker
  - tailscaled

descriptions:
  cargo-sweep: Trims stale cargo target/ artifacts (driven by cargo-sweep.timer)
  neovim: Hyperextensible text editor
  tree-sitter-cli: Tree-sitter CLI — compiles parsers for nvim-treesitter's main branch (required since AstroNvim v6)
  cursor-bin: AI-powered code editor (AUR)
  zed: High-performance collaborative code editor
  git: Distributed version control system
  github-cli: GitHub CLI
  lazygit: Terminal UI for git
  hunk: Review-first terminal diff viewer for agent changesets (npm hunkdiff)
  tuicr: Code review TUI with vim keybindings (local diffs + GitHub PRs)
  tea: Command-line client for Gitea servers
  docker: Container runtime engine
  docker-compose: Multi-container orchestration
  lazydocker: Terminal UI for Docker
  cmake: Cross-platform build system generator
  cpio: Archive copy utility
  base-devel: Base development tools
  just: Command runner (like make, simpler)
  gh-dash: Terminal UI dashboard for GitHub PRs/issues
  tailscale: Mesh VPN for secure networking
  worktrunk-bin: Git worktree manager for AI workflows (AUR)
  herdr: Agent multiplexer — one terminal for all coding agents
  claude-code: AI-powered coding assistant CLI
  codex: OpenAI Codex coding agent CLI (npm @openai/codex)
  ccstatusline: Claude Code status line with flat Catppuccin-matched theme
  bun: Fast all-in-one JavaScript runtime, bundler, and package manager
  direnv: Per-directory environment variables (auto-loads .env)

desktop_only:
  - cursor-bin

# Tools installed via custom commands (not available in package managers).
# These appear in the package selector alongside distro packages.
# Fields: name (display + selection key), check (command to test if installed),
#         install (shell command to run), requires (dependency command to check),
#         requires_packages (map of distro family -> system packages to
#         install before running `install`)
# Update fields (binary, version, source, update, updated_by) are documented in
# packages/common.yaml and read by 'dots update'.
custom_install:
  - name: claude-code
    check: command -v claude
    install: curl -fsSL https://claude.ai/install.sh | bash
    binary: claude
    updated_by: self
  # OpenAI Codex CLI — bootstrapped via npm, but the package then manages its
  # own standalone builds under ~/.codex/packages/ (a `current` symlink per
  # release), so it is no longer an npm global and updates itself.
  - name: codex
    check: command -v codex
    install: npm install -g @openai/codex
    requires: npm
    binary: codex
    source: openai/codex
    updated_by: self
  # hunk — review-first diff viewer used as the herdr `dev` review pane.
  # Not in distro repos; installed via npm like codex. Needs node/npm, which
  # fnm provides.
  - name: hunk
    check: command -v hunk
    install: npm install -g hunkdiff
    requires: npm
    binary: hunk
    npm: hunkdiff
  # Agent multiplexer (dev/wts herdr backend). Was the AUR herdr-bin, but herdr
  # only silences its in-app update prompt for Nix/mise/Homebrew — under pacman it
  # nagged forever and its `herdr update` could not write to a root-owned
  # /usr/bin/herdr. Its own installer drops the binary in ~/.local/bin, where
  # self-update works and a protocol bump asks before stopping the server.
  # The check probes the installer's own target rather than `command -v herdr`:
  # on a machine still holding herdr-bin, PATH answers yes from /usr/bin and the
  # entry is never offered, while the same scan offers to drop herdr-bin — which
  # would take the only herdr away.
  - name: herdr
    check: '[ -x "$HOME/.local/bin/herdr" ]'
    install: curl -fsSL https://herdr.dev/install.sh | sh
    binary: herdr
    source: herdrdev/herdr
    updated_by: self
  - name: gh-dash
    check: gh extension list 2>/dev/null | grep -q dlvhdr/gh-dash
    install: gh extension install dlvhdr/gh-dash
    requires: gh
    # A gh extension, not a binary on PATH: version comes from `gh extension
    # list` and the upgrade goes through gh rather than a re-install. The list is
    # tab-separated and its first field holds a space ("gh dash"), so the repo
    # and version only land in fixed columns with -F'\t'.
    version: gh extension list 2>/dev/null | awk -F'\t' '$2 == "dlvhdr/gh-dash" { print $3 }'
    source: dlvhdr/gh-dash
    update: gh extension upgrade dash

packages:
  arch:
    # Editors
    - neovim
    - tree-sitter-cli  # nvim-treesitter main-branch parser compiler (AstroNvim v6+)
    - cursor-bin  # AUR
    - zed

    # Git tools
    - git
    - github-cli
    - lazygit
    - tuicr
    - tea
    
    # Containers
    - docker
    - docker-compose
    - lazydocker
    
    # Build tools
    - cmake
    - cpio
    - base-devel
    - cargo-sweep  # weekly cargo-sweep.timer trims stale target/ artifacts

    # Script linters (pre-commit hook in this repo)
    - shellcheck
    - ruff
    
    # Networking
    - tailscale

    # Task runner
    - just

    # Worktree management
    - worktrunk-bin  # AUR

    # JS runtime & per-project env
    - bun
    - direnv
