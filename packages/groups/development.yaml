# Development - Development tools and environments
name: Development
description: Development tools (docker, neovim, git tools, editors)
icon: 💻
environment: both

# Dotfiles to install when this group is selected
dotfiles:
  - dot_config/nvim
  - dot_config/Cursor
  - dot_config/hunk
  - dot_config/tuicr
  - dot_config/gh-dash
  - dot_config/worktrunk
  - dot_config/ccstatusline
  - dot_gitconfig

# Services to enable
services:
  - docker
  - tailscaled

descriptions:
  cargo-sweep: Trims stale cargo target/ artifacts (driven by cargo-sweep.timer)
  neovim: Hyperextensible text editor
  tree-sitter-cli: Tree-sitter CLI — compiles parsers for nvim-treesitter's main branch (required since AstroNvim v6)
  cursor-bin: AI-powered code editor (AUR)
  zed: High-performance collaborative code editor
  git: Distributed version control system
  github-cli: GitHub CLI
  lazygit: Terminal UI for git
  hunk: Review-first terminal diff viewer for agent changesets (npm hunkdiff)
  tuicr: Code review TUI with vim keybindings (local diffs + GitHub PRs)
  tea: Command-line client for Gitea servers
  docker: Container runtime engine
  docker-compose: Multi-container orchestration
  lazydocker: Terminal UI for Docker
  cmake: Cross-platform build system generator
  cpio: Archive copy utility
  base-devel: Base development tools
  just: Command runner (like make, simpler)
  gh-dash: Terminal UI dashboard for GitHub PRs/issues
  tailscale: Mesh VPN for secure networking
  worktrunk-bin: Git worktree manager for AI workflows (AUR)
  claude-code: AI-powered coding assistant CLI
  codex: OpenAI Codex coding agent CLI (npm @openai/codex)
  vite-plus: Vite+ build toolchain (`vp`, npm vite-plus)
  ccstatusline: Claude Code status line with flat Catppuccin-matched theme
  codeburn: Token/cost tracker for the coding agents, read from local session files (npm)
  codeburn-desktop: CodeBurn's Electron dashboard (AppImage, desktop only)
  bun: Fast all-in-one JavaScript runtime, bundler, and package manager
  direnv: Per-directory environment variables (auto-loads .env)

desktop_only:
  - cursor-bin
  - codeburn-desktop

# Tools installed via custom commands (not available in package managers).
# These appear in the package selector alongside distro packages.
# Fields: name (display + selection key), check (command to test if installed),
#         install (shell command to run), requires (dependency command to check),
#         requires_packages (map of distro family -> system packages to
#         install before running `install`)
# Update fields (binary, version, source, update, updated_by) are documented in
# packages/common.yaml and read by 'dots update'.
custom_install:
  - name: claude-code
    check: command -v claude
    install: curl -fsSL https://claude.ai/install.sh | bash
    binary: claude
    updated_by: self
  # OpenAI Codex CLI — bootstrapped via npm, but the package then manages its
  # own standalone builds under ~/.codex/packages/ (a `current` symlink per
  # release), so it is no longer an npm global and updates itself.
  - name: codex
    check: command -v codex
    install: npm install -g @openai/codex
    requires: npm
    binary: codex
    source: openai/codex
    updated_by: self
  # hunk — review-first diff viewer for agent changesets. Not in distro repos;
  # installed via npm like codex. Needs node/npm, which fnm provides.
  - name: hunk
    check: command -v hunk
    install: npm install -g hunkdiff
    requires: npm
    binary: hunk
    npm: hunkdiff
  # vite-plus — the Vite+ toolchain (`vp`). Declared so a development machine
  # gets it from `dots packages sync` and has it tracked by `dots update`, rather
  # than each consumer hand-installing it: `t3fork install` needs it to build the
  # T3 Code fork's AppImage and stops on its own guard without it, which is how a
  # machine ended up with that fork checked out and no way to build it.
  #
  # The npm package rather than `curl https://vite.plus | bash` — same toolchain,
  # the tarball ships bin/vp — because npm is the install path this file's other
  # JS entries already use, and the one `dots update` can read a version out of
  # (`npm outdated -g`, already fetched once per run) with no extra round trip.
  # Note the Node-bump repair does *not* depend on this entry: it reads the
  # globals installed under the version being left, not the yaml.
  - name: vite-plus
    check: command -v vp
    install: npm install -g vite-plus
    requires: npm
    binary: vp
    npm: vite-plus
  # codeburn — reads what the coding agents already wrote to disk (~/.claude,
  # ~/.codex, and a dozen more) and reports tokens + cost by day, model, project
  # and session. No proxy, no API key, nothing leaves the machine, so it costs
  # nothing to have installed and is only paid for when it is run.
  #
  # Sits next to claude-code and codex rather than in the ai group: it is the
  # meter for those two, works headless, and the ai group is desktop-only.
  - name: codeburn
    check: command -v codeburn
    install: npm install -g codeburn
    requires: npm
    binary: codeburn
    npm: codeburn
  # The Electron front end for the same data — it bundles its own copy of the
  # CLI and drives it, so it does not read the entry above and is not broken by
  # its absence.
  #
  # --tag-prefix desktop- is load-bearing: upstream cuts one release per
  # platform under its own tag, so without it this resolves to whichever
  # platform shipped last and finds no Linux build. Why that is, and what else
  # a tag-prefixed app has to get right, is in
  # .claude/rules/manage-external-apps.md.
  - name: codeburn-desktop
    check: '[ -x "$HOME/.local/share/AppImages/codeburn.AppImage" ]'
    requires: curl
    # FUSE is needed to *run* the AppImage; the import only extracts it.
    requires_packages:
      arch: [fuse2]
    install: |
      "$DOTFILES_DIR/tools/manage-external-apps.py" install-github getagentseal/codeburn \
        --name CodeBurn --type appimage --tag-prefix desktop- --non-interactive
    # Tracked as an external app, so 'dots update' reports it from the apps
    # updater rather than re-running the install command.
    updated_by: app
  - name: gh-dash
    check: gh extension list 2>/dev/null | grep -q dlvhdr/gh-dash
    install: gh extension install dlvhdr/gh-dash
    requires: gh
    # A gh extension, not a binary on PATH: version comes from `gh extension
    # list` and the upgrade goes through gh rather than a re-install. The list is
    # tab-separated and its first field holds a space ("gh dash"), so the repo
    # and version only land in fixed columns with -F'\t'.
    version: gh extension list 2>/dev/null | awk -F'\t' '$2 == "dlvhdr/gh-dash" { print $3 }'
    source: dlvhdr/gh-dash
    update: gh extension upgrade dash

packages:
  arch:
    # Editors
    - neovim
    - tree-sitter-cli  # nvim-treesitter main-branch parser compiler (AstroNvim v6+)
    - cursor-bin  # AUR
    - zed

    # Git tools
    - git
    - github-cli
    - lazygit
    - tuicr
    - tea
    
    # Containers
    - docker
    - docker-compose
    - lazydocker
    
    # Build tools
    - cmake
    - cpio
    - base-devel
    - cargo-sweep  # weekly cargo-sweep.timer trims stale target/ artifacts

    # Script linters (pre-commit hook in this repo)
    - shellcheck
    - ruff
    
    # Networking
    - tailscale

    # Task runner
    - just

    # Worktree management
    - worktrunk-bin  # AUR

    # JS runtime & per-project env
    - bun
    - direnv
